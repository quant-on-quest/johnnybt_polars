# Build the wheels people install, then publish them.
#
# Six cells: linux / macOS / Windows × x86_64 / arm64, each built on a runner
# of that architecture — nothing is cross-compiled, so there is no toolchain
# to get subtly wrong. The extension is abi3 for Python 3.11, so one wheel
# per platform covers 3.11 through 3.14: the matrix is about machines, not
# interpreters.
#
# Publishing uses PyPI's trusted publishing (OIDC) — no token lives here.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04, target: x86_64, manylinux: auto }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: macos, arch: x86_64, runner: macos-15-intel, target: x86_64, manylinux: off }
          - { os: macos, arch: arm64, runner: macos-latest, target: aarch64, manylinux: off }
          - { os: windows, arch: x86_64, runner: windows-latest, target: x64, manylinux: off }
          - { os: windows, arch: arm64, runner: windows-11-arm, target: aarch64, manylinux: off }
    steps:
      # This crate links the account walk by path (`../johnnybt_engine`), so
      # both repositories are checked out as siblings under the workspace —
      # the same layout a workstation has. In container builds the workspace
      # is what gets mounted, so the sibling is visible there too.
      - uses: actions/checkout@v6
        with:
          path: johnnybt_polars

      - uses: actions/checkout@v6
        with:
          repository: quant-on-quest/johnnybt_engine
          path: johnnybt_engine

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: johnnybt_polars
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: johnnybt_polars/dist/*.whl
          if-no-files-found: error

  smoke:
    name: install a wheel and import it
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, artifact: wheels-linux-x86_64 }
          - { runner: macos-latest, artifact: wheels-macos-arm64 }
          - { runner: windows-latest, artifact: wheels-windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v7
        with: { name: "${{ matrix.artifact }}", path: dist }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: install
        shell: bash
        run: python -m pip install --find-links dist johnnybt-polars
      # Not just "does it import": the plugin has to register with the
      # polars in front of it. `abi_probe` exists for exactly this — it adds
      # one, inside Rust, through the expression engine.
      - name: run an expression
        shell: bash
        run: |
          python - <<'PY'
          import polars as pl
          import johnnybt_polars as lib
          frame = pl.DataFrame({"n": [1, 2, 3]}).with_columns(lib.abi_probe("n").alias("plus"))
          assert frame["plus"].to_list() == [2, 3, 4], frame
          print(frame)
          print(sorted(lib.__all__))
          PY

  publish:
    name: publish to PyPI
    needs: [wheels, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
