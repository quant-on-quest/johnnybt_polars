[package]
name = "johnnybt_polars"
version = "0.1.0"
edition = "2021"

[lib]
name = "johnnybt_polars"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.55.1", features = ["dtype-date", "dtype-struct", "temporal", "ipc_streaming"], default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
memchr = "2"
rayon = "1.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
futures = "0.3"
arrow = { version = "55", features = ["ipc"] }
chrono = "0.4"
numpy = "0.29"

[profile.release]
lto = true
codegen-units = 1
